[project]
name = "decision-judge"
version = "0.1.0"
description = "LLM-as-a-judge style output validation with decision models (tev1 on Ollama)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
decision-judge = "decision_judge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
